<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мира Тимербаева</title>
<meta name="description" content="Мира Тимербаева — специалист по нейросетям. Telegram: @mirashine">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0a0a'/><text x='16' y='23' font-family='sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%23ff2d78'>М</text></svg>">

<style>
/* ============================================================
   ПЕРЕМЕННЫЕ — меняй цвета здесь, они разойдутся по всей странице
   ============================================================ */
:root{
  --bg:         #0a0a0a;   /* основной фон */
  --card:       #101014;   /* фон карточки */
  --text:       #f4f4f5;   /* основной текст */
  --muted:      #8b8b96;   /* второстепенный текст */
  --rose:       #e6397a;   /* малиновый — главный акцент */
  --ruby:       #ff2d78;   /* яркая малина */
  --blush:      #ffa6c9;   /* светлый розовый */
  --stroke:     rgba(255,255,255,.09);
  --radius:     28px;

  /* Шрифты. Без интернета берём то, что уже стоит в системе:
     Avenir Next — на маке, Trebuchet и Segoe UI — на винде, дальше запасные. */
  --font-display: "Avenir Next", "Futura", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body:    "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI",
                  Roboto, "Helvetica Neue", Arial, sans-serif;

  color-scheme: dark;
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{ height:100%; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 16px;            /* 16px — боковые отступы на телефоне */
  overflow-x:hidden;            /* страницу нельзя увезти вбок */
  position:relative;
}

/* ============================================================
   ФОН: малиновое зарево + звёздное небо + метеоры + свет под курсором
   ============================================================ */
.bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

/* малиновое зарево, медленно дышит */
.bg::before{
  content:"";
  position:absolute; inset:-20%;
  background:
    radial-gradient(38% 42% at 18% 14%, rgba(230,57,122,.26), transparent 70%),
    radial-gradient(34% 38% at 84% 22%, rgba(255,45,120,.18), transparent 70%),
    radial-gradient(40% 44% at 60% 96%, rgba(140,0,60,.30), transparent 70%);
  filter:blur(18px);
  animation:breathe 16s ease-in-out infinite alternate;
}

/* ЗВЁЗДЫ. Каждая строка radial-gradient — одна звезда: размер, позиция, цвет.
   Хочешь гуще — допиши строк; хочешь крупнее — увеличь первые два значения. */
.bg::after{
  content:"";
  position:absolute; inset:0;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 18%, #fff,              transparent),
    radial-gradient(1.2px 1.2px at 27% 62%, rgba(255,255,255,.85), transparent),
    radial-gradient(2px   2px   at 41%  9%, #ffd9e8,           transparent),
    radial-gradient(1.1px 1.1px at 55% 44%, rgba(255,255,255,.75), transparent),
    radial-gradient(1.7px 1.7px at 68% 77%, #fff,              transparent),
    radial-gradient(1.3px 1.3px at 79% 26%, rgba(255,166,201,.9), transparent),
    radial-gradient(1px   1px   at  8% 83%, rgba(255,255,255,.7),  transparent),
    radial-gradient(1.9px 1.9px at 91% 55%, #fff,              transparent),
    radial-gradient(1.2px 1.2px at 34% 92%, rgba(255,255,255,.8),  transparent),
    radial-gradient(1.4px 1.4px at 61% 15%, rgba(255,217,232,.9), transparent),
    radial-gradient(1px   1px   at 48% 71%, rgba(255,255,255,.65), transparent),
    radial-gradient(1.5px 1.5px at 85% 88%, #fff,              transparent),
    radial-gradient(1.1px 1.1px at 19% 38%, rgba(255,255,255,.7),  transparent),
    radial-gradient(1.8px 1.8px at 73% 50%, rgba(255,166,201,.85), transparent);
  background-size:420px 420px;      /* узор повторяется такими квадратами */
  animation:twinkle 5s ease-in-out infinite alternate;
}

@keyframes twinkle{
  from{ opacity:.45 }
  to  { opacity:1   }
}

/* ============================================================
   ПАДАЮЩИЕ ЗВЁЗДЫ.
   Каждая .meteor — точка с хвостом, летит сверху-справа вниз-влево.
   Параметры каждой заданы ниже в :nth-child — правь смело.
   ============================================================ */
.meteor{
  position:absolute;
  top:-10vh; left:0;
  width:3px; height:3px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px 3px rgba(255,138,180,.95);
  opacity:0;
  animation:fall linear infinite;
}

/* хвост: вытянутая полоска позади точки */
.meteor::after{
  content:"";
  position:absolute; top:50%; left:0;
  width:var(--tail, 150px); height:2.4px;
  transform:translateY(-50%);
  transform-origin:left center;
  background:linear-gradient(90deg, #fff, rgba(255,110,165,.75) 35%, rgba(255,45,120,.25) 70%, transparent);
  border-radius:2px;
  filter:blur(.3px);
}

/* летит по диагонали: вниз и влево, поэтому хвост развёрнут вправо-вверх */
@keyframes fall{
  0%  { opacity:0; transform:translate3d(0,0,0) rotate(-45deg) }
  8%  { opacity:1 }
  70% { opacity:1 }
  100%{ opacity:0; transform:translate3d(-75vw, 115vh, 0) rotate(-45deg) }
}

/* левая позиция старта / длина хвоста / скорость / задержка */
.meteor:nth-child(1){ left: 72%; --tail:170px; animation-duration:2.6s; animation-delay:0s   }
.meteor:nth-child(2){ left: 95%; --tail:120px; animation-duration:3.4s; animation-delay:1.2s }
.meteor:nth-child(3){ left: 58%; --tail:200px; animation-duration:2.2s; animation-delay:2.9s }
.meteor:nth-child(4){ left: 84%; --tail:140px; animation-duration:4.1s; animation-delay:4.4s }
.meteor:nth-child(5){ left:100%; --tail:230px; animation-duration:3.0s; animation-delay:6.1s }
.meteor:nth-child(6){ left: 45%; --tail:110px; animation-duration:3.8s; animation-delay:8.0s }
.meteor:nth-child(7){ left: 66%; --tail:180px; animation-duration:2.4s; animation-delay:10.5s }

/* свет, который следует за курсором (на телефоне просто не включается) */
.spotlight{
  position:fixed; z-index:1; pointer-events:none;
  width:620px; height:620px; left:0; top:0;
  margin:-310px 0 0 -310px;
  background:radial-gradient(circle, rgba(230,57,122,.16), transparent 62%);
  opacity:0;
  transition:opacity .5s ease;
  will-change:transform;
}

@keyframes breathe{
  from{ transform:translate3d(0,0,0) scale(1); }
  to  { transform:translate3d(0,-3%,0) scale(1.08); }
}

/* ============================================================
   КАРТОЧКА
   ============================================================ */
.card{
  position:relative; z-index:2;
  width:100%; max-width:560px;
  margin:auto;                  /* центрирует и не срезает верх на низких экранах */
  padding:clamp(30px, 6vw, 56px) clamp(22px, 5vw, 48px) clamp(26px, 5vw, 44px);
  text-align:center;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 30px 80px -20px rgba(0,0,0,.9);
}

/* светящаяся кромка сверху */
.card::before{
  content:"";
  position:absolute; left:12%; right:12%; top:-1px; height:1px;
  background:linear-gradient(90deg, transparent, var(--rose), var(--ruby), transparent);
  opacity:.8;
}

/* всё внутри карточки появляется по очереди */
.reveal{ opacity:0; animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
.reveal:nth-child(1){ animation-delay:.05s }
.reveal:nth-child(2){ animation-delay:.16s }
.reveal:nth-child(3){ animation-delay:.26s }
.reveal:nth-child(4){ animation-delay:.36s }
.reveal:nth-child(5){ animation-delay:.46s }
.reveal:nth-child(6){ animation-delay:.56s }
.reveal:nth-child(7){ animation-delay:.66s }

@keyframes rise{
  from{ opacity:0; transform:translateY(14px) }
  to  { opacity:1; transform:none }
}

/* ============================================================
   АВАТАР — инициалы в градиентном кольце.
   Хочешь фото: замени <div class="avatar">МТ</div> на
   <img class="avatar" src="foto.jpg" alt="Мира Тимербаева">
   ============================================================ */
.avatar-wrap{
  position:relative; isolation:isolate;   /* чтобы свечение осталось внутри, а не уехало за карточку */
  width:112px; height:112px; margin:0 auto 22px;
}

.avatar-wrap::before{            /* вращающееся градиентное кольцо */
  content:"";
  position:absolute; inset:-3px;
  border-radius:50%;
  background:conic-gradient(from 0deg, var(--rose), var(--ruby), var(--blush), var(--rose));
  animation:spin 7s linear infinite;
}

.avatar-wrap::after{             /* мягкое свечение под аватаром */
  content:"";
  position:absolute; inset:-14px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(230,57,122,.45), transparent 65%);
  filter:blur(14px);
  z-index:-1;
}

.avatar{
  position:relative;
  width:112px; height:112px;
  border-radius:50%;
  display:grid; place-items:center;
  background:#121218;                     /* тёмная заливка круга */
  border:3px solid var(--bg);
  font-size:38px; font-weight:650; letter-spacing:.02em;
  object-fit:cover;
  overflow:hidden;
}

/* градиент только на буквах, не на всём круге */
.avatar span{
  font-family:var(--font-display);
  background-image:linear-gradient(160deg, #ffe3ee, #ff2d78 48%, #8c0038);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
}

@keyframes spin{ to{ transform:rotate(360deg) } }

/* ============================================================
   ИМЯ — градиент + свечение.
   Свечение рисует дубль текста из data-text под основным слоем.
   ============================================================ */
.name{
  position:relative;
  isolation:isolate;                        /* чтобы свечение не уехало за карточку */
  margin:0 0 14px;
  font-family:var(--font-display);
  font-size:clamp(1.95rem, 8.8vw, 3.4rem);
  line-height:1.05;
  font-weight:800;
  letter-spacing:.012em;
  text-transform:uppercase;

  /* малиновое свечение вокруг букв: повторяет их форму при любом переносе */
  filter:drop-shadow(0 0 16px rgba(255,45,120,.55))
         drop-shadow(0 0 42px rgba(230,57,122,.35));

  animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;
}

/* ЗЕРКАЛЬНАЯ МАЛИНА — на каждой строке отдельно, иначе блик размазывается
   по всему блоку и на верхней строке его не видно.
   Градиент сверху вниз: светлый край → тёмная малина → белый блик →
   снова малина → отражённый свет снизу. Так выглядит полированный металл. */
.name span{
  display:block;
  background:linear-gradient(177deg,
     #ffe3ee  0%,
     #ff6fa5 13%,
     #b8003f 29%,
     #ffffff 43%,
     #ffd9e8 47%,
     #ff2d78 58%,
     #8c0038 76%,
     #ff6fa5 91%,
     #ffe3ee 100%);
  /* 150% — небольшой запас по высоте: блик ездит, но всегда остаётся на буквах.
     Поставишь больше (например 260%) — блик будет уезжать за текст и пропадать. */
  background-size:100% 150%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  animation:shine 7s ease-in-out infinite alternate;
}

/* вторая строка ловит блик не одновременно с первой — так живее */
.name span:nth-child(2){ animation-delay:-2.4s }

/* блик ходит по буквам сверху вниз и обратно — это и даёт «зеркальность» */
@keyframes shine{
  from{ background-position:50% 0%   }
  to  { background-position:50% 100% }
}

.role{
  margin:0 0 22px;
  font-family:var(--font-display);
  font-size:clamp(.72rem, 3vw, .84rem);
  color:var(--blush);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.26em;          /* разрядка — спокойный контраст крупному имени */
  text-indent:.26em;             /* компенсирует разрядку последней буквы */
}

/* ник — кликабельный, копируется в буфер */
.handle{
  display:inline-flex; align-items:center; gap:7px;
  margin:0 0 28px;
  padding:7px 14px;
  font:inherit; font-size:.86rem; color:var(--muted);
  background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);
  border-radius:999px;
  cursor:pointer;
  transition:color .25s, border-color .25s, background .25s, transform .25s;
}
.handle:hover{
  color:var(--text);
  border-color:rgba(230,57,122,.55);
  background:rgba(230,57,122,.10);
  transform:translateY(-1px);
}
.handle svg{ width:14px; height:14px; opacity:.7 }

/* ============================================================
   СОЦСЕТИ
   ============================================================ */
.socials{
  display:flex; justify-content:center; gap:14px;
  margin:0 0 30px;
}

.social{
  position:relative;
  width:52px; height:52px;
  display:grid; place-items:center;
  color:var(--muted);
  background:rgba(255,255,255,.035);
  border:1px solid var(--stroke);
  border-radius:16px;
  text-decoration:none;
  transition:color .3s, transform .3s cubic-bezier(.2,.8,.2,1),
             border-color .3s, background .3s, box-shadow .3s;
}
.social svg{ width:23px; height:23px; }

.social:hover,
.social:focus-visible{
  color:#fff;
  transform:translateY(-6px);
  border-color:transparent;
  background:linear-gradient(135deg, var(--rose), var(--ruby));
  box-shadow:0 12px 28px -8px rgba(230,57,122,.75);
  outline:none;
}

/* подпись, которая всплывает над иконкой */
.social::after{
  content:attr(data-tip);
  position:absolute; bottom:calc(100% + 10px); left:50%;
  transform:translate(-50%, 6px);
  padding:5px 10px;
  font-size:.72rem; white-space:nowrap;
  color:var(--text);
  background:#1a1a20;
  border:1px solid var(--stroke);
  border-radius:8px;
  opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s;
}
.social:hover::after,
.social:focus-visible::after{ opacity:1; transform:translate(-50%,0) }

/* ============================================================
   КНОПКА «НАПИСАТЬ МНЕ»
   ============================================================ */
/* обёртка держит появление и пульсацию, сама кнопка — градиент и наведение.
   Разнесено специально: анимация на элементе перебивает его же :hover-стили. */
.cta-wrap{
  display:inline-block;
  width:100%; max-width:320px;
  border-radius:16px;
  animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards,
            pulse 3.4s ease-in-out infinite;
}

.cta{
  position:relative;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  width:100%;
  padding:17px 30px;
  font-size:1.02rem; font-weight:600; letter-spacing:.01em;
  color:#2a0012;
  text-decoration:none;
  background:linear-gradient(100deg, #ffd9e8, #ff6fa5 28%, #ff2d78 52%, #ff6fa5 76%, #ffd9e8);
  background-size:200% 100%;
  border:0; border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  animation:flow 6s linear infinite;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
}
.cta svg{ width:19px; height:19px; }

/* блик, пробегающий по кнопке */
.cta::before{
  content:"";
  position:absolute; top:0; bottom:0; left:-60%;
  width:45%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent);
  transform:skewX(-20deg);
  animation:sweep 3.6s ease-in-out infinite;
}

.cta:hover,
.cta:focus-visible{
  transform:translateY(-3px) scale(1.015);
  box-shadow:0 18px 40px -12px rgba(230,57,122,.85);
  outline:none;
}
.cta:active{ transform:translateY(-1px) scale(.995) }

@keyframes flow{  to{ background-position:200% 50% } }
@keyframes sweep{ 0%{ left:-60% } 55%,100%{ left:130% } }
@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(230,57,122,.45) }
  50%    { box-shadow:0 0 0 16px rgba(230,57,122,0) }
}

.foot{
  margin:22px 0 0;
  font-size:.76rem; color:#5f5f6b;
}

/* ============================================================
   ТОСТ «скопировано»
   ============================================================ */
.toast{
  position:fixed; z-index:9; left:50%; bottom:34px;
  transform:translate(-50%, 20px);
  padding:11px 20px;
  font-size:.86rem;
  background:#17171d; color:var(--text);
  border:1px solid rgba(230,57,122,.45);
  border-radius:12px;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.9);
  opacity:0; pointer-events:none;
  transition:opacity .3s, transform .3s;
}
.toast.show{ opacity:1; transform:translate(-50%,0) }

/* ============================================================
   ТЕЛЕФОН
   ============================================================ */
@media (max-width:420px){
  body{ padding:24px 16px }
  .avatar-wrap,.avatar{ width:96px; height:96px }
  .avatar{ font-size:33px }
  .socials{ gap:11px }
  .social{ width:48px; height:48px }
  .cta-wrap{ max-width:none }
}

/* на телефоне подсказки над иконками только мешают */
@media (hover:none){
  .social::after{ display:none }
}

/* кому анимации мешают — выключаем все */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .reveal{ opacity:1 }
  .spotlight{ display:none }
  .meteor{ display:none }        /* падающие звёзды убираем совсем */
  .bg::after{ opacity:1 }        /* звёздное небо остаётся, но без мерцания */
}
</style>
</head>

<body>

<!-- фон: зарево + звёзды. Внутри — падающие звёзды, по одному div на каждую -->
<div class="bg">
  <i class="meteor"></i>
  <i class="meteor"></i>
  <i class="meteor"></i>
  <i class="meteor"></i>
  <i class="meteor"></i>
  <i class="meteor"></i>
  <i class="meteor"></i>
</div>

<div class="spotlight" id="spotlight"></div>

<main class="card">

  <!-- Аватар: инициалы. Для фото — замени div на <img class="avatar" src="..." alt="..."> -->
  <div class="avatar-wrap reveal">
    <div class="avatar"><span>МТ</span></div>
  </div>

  <!-- имя разбито на две строки: так зеркальный блик ложится на каждую -->
  <h1 class="name reveal"><span>Мира</span><span>Тимербаева</span></h1>

  <p class="role reveal">Специалист по нейросетям</p>

  <button class="handle reveal" id="handle" type="button" data-copy="@mirashine" title="Нажми, чтобы скопировать">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="9" width="12" height="12" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    @mirashine
  </button>

  <nav class="socials reveal" aria-label="Социальные сети">

    <a class="social" href="https://t.me/mirashine" target="_blank" rel="noopener" data-tip="Telegram" aria-label="Telegram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2 11 13"/>
        <path d="M22 2 15 22l-4-9-9-4Z"/>
      </svg>
    </a>

    <!-- ЗАМЕНИ href на свой профиль Instagram -->
    <a class="social" href="#" data-tip="Instagram" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </a>

<div class="toast" id="toast" role="status" aria-live="polite">Скопировано</div>

<script>
(function () {
  'use strict';

  /* --- свет под курсором: только там, где есть мышь --- */
  var spot = document.getElementById('spotlight');
  if (spot && window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
    var x = 0, y = 0, queued = false;

    window.addEventListener('pointermove', function (e) {
      x = e.clientX; y = e.clientY;
      if (queued) return;              // не чаще одного кадра — чтобы не тормозило
      queued = true;
      requestAnimationFrame(function () {
        spot.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
        spot.style.opacity = '1';
        queued = false;
      });
    }, { passive: true });

    document.addEventListener('mouseleave', function () { spot.style.opacity = '0'; });
  }

  /* --- копирование ника + тост --- */
  var toast = document.getElementById('toast');
  var timer = null;

  function showToast(text) {
    if (!toast) return;
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function () { toast.classList.remove('show'); }, 1900);
  }

  function copy(text) {
    // современный путь
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(function () { showToast('Скопировано: ' + text); })
        .catch(function () { showToast(text); });   // не дали доступ — хотя бы покажем
      return;
    }
    // запасной путь для file:// и старых браузеров
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(ok ? 'Скопировано: ' + text : text);
    } catch (err) {
      showToast(text);
    }
  }

  var handle = document.getElementById('handle');
  if (handle) {
    handle.addEventListener('click', function () {
      copy(handle.dataset.copy || '@mirashine');
    });
  }
})();
</script>
